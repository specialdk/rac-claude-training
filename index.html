<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAC Claude Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --earth:#7F2C2F; --maroon:#5C2B34; --cream:#F0EBE1;
  --ink:#1D2426; --sun:#F4C63F; --paper:#F6F5F2;
  --ink-soft:#5E5A55; --line:#E2DED6;
  --r:10px; --sh:0 1px 3px rgba(29,36,38,.08);
}

body{font-family:'Quicksand',system-ui,sans-serif;font-size:16px;line-height:1.65;color:var(--ink);background:var(--paper)}
.app{display:flex;min-height:100vh}

.side{width:270px;background:var(--ink);color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:50}
.side-head{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.side-logo{width:44px;height:44px;background:var(--earth);border:2px solid var(--sun);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:10px;font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif}
.side-org{font-size:11px;color:var(--sun);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.side-t{font-size:13px;color:rgba(255,255,255,.65);margin-top:2px}
.side-nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-day{padding:14px 18px 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#fff;font-weight:700;border-top:1px solid rgba(255,255,255,.14);margin-top:8px;font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif}
.nav-day:first-child{border-top:none;margin-top:0}
.nav-part{padding:11px 18px 4px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--sun);font-weight:700}
.nav-l{display:flex;gap:9px;align-items:baseline;padding:6px 18px;cursor:pointer;font-size:13.5px;color:rgba(255,255,255,.72);border-left:3px solid transparent;transition:.15s}
.nav-l:hover{background:rgba(255,255,255,.07);color:#fff;border-left-color:var(--sun)}
.nav-n{color:var(--sun);font-weight:700;font-size:11.5px;min-width:26px;flex-shrink:0}
.side-foot{padding:13px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.4)}

.main{margin-left:270px;flex:1;padding:0 0 90px}
.hero{background:var(--earth);color:#fff;padding:34px 46px 30px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:7px;background-image:radial-gradient(circle,var(--sun) 1.5px,transparent 1.5px);background-size:13px 13px;opacity:.45}
.hero h1{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:32px;font-weight:600;letter-spacing:.3px}
.hero .sub{font-size:15px;opacity:.88;margin-top:4px;max-width:640px}
.wrap{max-width:900px;padding:26px 46px}

.panel{background:#fff;border-radius:var(--r);padding:20px 24px;margin-bottom:24px;box-shadow:var(--sh);border-left:4px solid var(--sun)}
.panel h3{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--earth);margin-bottom:10px}
.panel p{font-size:14.5px;color:var(--ink-soft)}
.hw{padding:9px 0;font-size:14.5px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.hw:last-child{border-bottom:none}
.hw b{color:var(--ink);font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-weight:600;font-size:15.5px;letter-spacing:.3px}

.dayband{margin:38px 0 12px;padding:14px 20px;border-radius:var(--r);background:var(--ink);color:#fff;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.dayband:first-child{margin-top:4px}
.dnum{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--sun)}
.dlab{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:19px;font-weight:600}

.part{margin:30px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.part h2{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:20px;color:var(--maroon);font-weight:600;letter-spacing:.3px}

.les{background:#fff;border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden;border:1px solid var(--line)}
.les-h{display:flex;gap:13px;align-items:baseline;padding:16px 22px 4px}
.les-n{background:var(--earth);color:#fff;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;flex-shrink:0;font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif}
.les-title{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:19px;font-weight:600;line-height:1.3;letter-spacing:.2px}
.les-body{padding:6px 22px 22px 22px}
.intro{font-size:15.5px;line-height:1.62;color:var(--ink-soft);margin:8px 0 4px}
ul.pts{margin:10px 0 2px;padding-left:0;list-style:none}
ul.pts li{position:relative;padding:4px 0 4px 22px;font-size:15px;line-height:1.6;color:var(--ink-soft)}
ul.pts li::before{content:'';position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--sun)}
ul.pts li strong{color:var(--ink)}
.h5{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--earth);font-weight:600;margin:18px 0 8px}

.pr{border:1.5px solid var(--line);border-radius:8px;padding:13px 15px;margin:10px 0;position:relative;background:#fff}
.pr:hover{border-color:var(--sun)}
.pr-top{margin-bottom:7px;padding-right:66px}
.pr-lab{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--maroon)}
.pr-txt{font-size:14.5px;background:var(--paper);padding:12px 14px;border-radius:6px;line-height:1.58;white-space:pre-wrap}
.cp{position:absolute;top:11px;right:12px;background:var(--earth);color:#fff;border:none;padding:5px 13px;border-radius:5px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Quicksand'}
.cp:hover{background:var(--maroon)}
.cp.ok{background:#4A7C59}

.ex{background:var(--cream);border-radius:8px;padding:15px 18px;margin:16px 0 2px}
.ex .h5{margin-top:0;color:var(--maroon)}
.ex p{font-size:14.5px;color:var(--ink)}

table.t{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
table.t th{background:var(--earth);color:#fff;padding:10px 14px;text-align:left;font-size:12.5px;font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-weight:600;letter-spacing:.4px}
table.t td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-soft)}
table.t tr:last-child td{border-bottom:none}
table.t td:first-child{font-weight:600;color:var(--ink)}
code{background:var(--cream);padding:1px 6px;border-radius:4px;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}


@media print{.side{display:none}.main{margin-left:0}.cp{display:none}.les{break-inside:avoid;box-shadow:none}}
.how{background:#fff;border:1.5px dashed var(--sun);border-radius:8px;padding:12px 16px;margin:14px 0 4px}
.how .h5{margin-top:0}
.how ul.pts li{font-size:14.5px}
.how .chk{font-family:'Quicksand',system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--ink-soft);font-weight:500}
.files{background:#fff;border:1.5px solid var(--sun);border-radius:8px;padding:12px 16px;margin:14px 0 4px}
.files .h5{margin-top:0}
.files a{display:inline-block;margin:2px 16px 6px 0;color:var(--earth);font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--sun)}
.files p{font-size:13.5px;color:var(--ink-soft);margin-top:4px}

/* ---------- online-only ---------- */
.side-nav .nav-home,.side-nav .nav-s{display:flex;gap:10px;align-items:center;padding:9px 18px;cursor:pointer;font-size:14px;color:rgba(255,255,255,.78);border-left:3px solid transparent}
.side-nav .nav-home:hover,.side-nav .nav-s:hover{background:rgba(255,255,255,.07);color:#fff}
.side-nav .active{border-left-color:var(--sun);color:#fff;background:rgba(255,255,255,.06)}
.nav-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.nav-dot.part{border-color:var(--sun)}
.nav-dot.done{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.page{display:none}.page.show{display:block}
.les-h{cursor:pointer;padding:16px 22px;align-items:center}
.les-h:hover{background:var(--paper)}
.les .les-body{display:none}.les.open .les-body{display:block}
.arw{margin-left:auto;color:var(--earth);font-size:12px;transition:transform .2s}
.les.open .arw{transform:rotate(180deg)}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.les.done .tick{background:#4A7C59;border-color:#4A7C59}
.les.done .les-title{color:var(--ink-soft)}
.more{background:#fff;border-left:3px solid var(--earth);padding:10px 14px;margin:14px 0 4px;font-size:14.5px;color:var(--ink-soft);border-radius:0 6px 6px 0}
.more .h5{margin-top:0}
.done-btn{margin-top:16px;background:none;border:1.5px solid #4A7C59;color:#4A7C59;padding:7px 16px;border-radius:6px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.les.done .done-btn{background:#4A7C59;color:#fff}
.quiz,.refl{background:#fff;border-radius:var(--r);padding:20px 24px;margin:26px 0 14px;box-shadow:var(--sh);border-top:4px solid var(--sun)}
.quiz h3,.refl h3{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:17px;color:var(--maroon);margin-bottom:12px;letter-spacing:.3px}
.qq{margin-bottom:18px}.qq p{font-weight:600;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1.5px solid var(--line);border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:14.5px}
.opt:hover{border-color:var(--sun)}
.opt b{color:var(--earth);min-width:16px}
.qq.answered .opt{cursor:default}
.opt.right{border-color:#4A7C59;background:#EDF4EE}
.opt.wrong{border-color:#B33A3A;background:#FBEDED}
.why{display:none;font-size:14px;color:var(--ink-soft);margin-top:6px;padding-left:4px}
.qq.answered .why{display:block}
.refl textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:7px;padding:12px;font-family:inherit;font-size:14.5px;resize:vertical}
.refl small{color:var(--ink-soft)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.btn{background:var(--earth);color:#fff;border:none;padding:10px 20px;border-radius:7px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn.dark{background:var(--ink)}
.btn:hover{opacity:.9}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:14px 0 24px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--sh)}
.card:hover{border-color:var(--sun)}
.card .cn{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;color:var(--earth);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.card .ct{font-weight:700;margin:2px 0 10px;line-height:1.3}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sun)}
.card .cs{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.menu-btn{display:none;position:fixed;top:12px;left:12px;z-index:60;background:var(--ink);color:#fff;border:none;border-radius:7px;width:42px;height:42px;font-size:20px;cursor:pointer}
.shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
@media(max-width:900px){
  .side{transform:translateX(-100%);transition:transform .25s}.side.open{transform:none}
  .shade.open{display:block}.menu-btn{display:block}
  .main{margin-left:0}.wrap{padding-left:16px;padding-right:16px}.hero{padding:62px 16px 26px}
  table.t{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<!-- Online course. ALL CONTENT COMES FROM content.js — edit that file, not this one. -->
<button class="menu-btn" aria-label="Menu">&#9776;</button>
<div class="shade"></div>
<div class="app">
  <nav class="side">
    <div class="side-head">
      <div class="side-logo">RAC</div>
      <div class="side-org">Rirratjingu</div>
      <div class="side-t">Claude Training &mdash; Online</div>
    </div>
    <div class="side-nav" id="nav"></div>
    <div class="side-foot">Nhulunbuy, NT &mdash; Yol&#x14B;u Country</div>
  </nav>
  <div class="main" id="pages"></div>
</div>
<script src="content.js"></script>
<script>
(function(){
  const C = COURSE;
  const KEY = 'rac-claude-course-v2';
  let st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { st = {}; }
  st.done = st.done || {}; st.quiz = st.quiz || {}; st.refl = st.refl || {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };
  const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const list = a => '<ul class="pts">' + a.map(p => '<li>' + p + '</li>').join('') + '</ul>';
  const lessonsOf = s => s.parts.flatMap(p => p.lessons);
  const progress = s => { const ls = lessonsOf(s); const d = ls.filter(l => st.done[l.n]).length; return [d, ls.length]; };

  // ---------- home ----------
  let home = '<div class="page" id="pg-home"><div class="hero"><h1>' + C.title + '</h1><div class="sub">Learn at your own pace. Four sessions, every prompt ready to copy. Tick off lessons as you go &mdash; your progress is saved in this browser.</div></div><div class="wrap">'
    + '<div class="panel"><h3>How this works</h3><p>Work through the sessions in order &mdash; each one builds on the last. Open a lesson, read it, try the prompts in Claude, then mark it complete. Each session ends with a short check and a question to think about. Change the words in any prompt to suit your own work.</p></div>'
    + '<div class="cards" id="cards"></div></div></div>';

  // ---------- sessions ----------
  let pages = '', nav = '<div class="nav-home" data-pg="home"><span class="nav-dot"></span>Home</div>';
  C.sessions.forEach((s, si) => {
    nav += '<div class="nav-s" data-pg="s' + s.n + '"><span class="nav-dot" id="dot-s' + s.n + '"></span>Session ' + s.n + ' &mdash; ' + s.label + '</div>';
    let h = '<div class="page" id="pg-s' + s.n + '"><div class="hero"><h1>Session ' + s.n + ': ' + s.label + '</h1><div class="sub" id="sub-s' + s.n + '"></div></div><div class="wrap">';
    s.parts.forEach(p => {
      h += '<div class="part"><h2>' + p.title + '</h2></div>';
      p.lessons.forEach(l => {
        const on = l.online || {};
        h += '<div class="les" id="L' + l.n + '"><div class="les-h"><span class="tick">&#10003;</span><span class="les-n">' + l.n + '</span><div class="les-title">' + l.title + '</div><span class="arw">&#9660;</span></div><div class="les-body">';
        if (l.intro)  h += '<p class="intro">' + l.intro + '</p>';
        if (l.points) h += list(l.points);
        if (l.files)  h += '<div class="files"><div class="h5">Files for this lesson</div>' + l.files.map(f => '<a href="' + f.href + '" target="_blank" rel="noopener">' + f.label + ' &#8599;</a>').join('') + '<p>Opens in SharePoint (RAC login needed). Click <strong>Download</strong>, then use the file as the lesson describes.</p></div>';
        if (on.more)  h += '<div class="more"><div class="h5">Working on your own</div>' + on.more + '</div>';
        if (l.howNow) h += '<div class="how"><div class="h5">How it looks right now <span class="chk">&mdash; checked ' + C.lastChecked + '</span></div>' + list(l.howNow) + '</div>';
        if (l.table)  h += '<table class="t"><thead><tr>' + l.table.head.map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>' + l.table.rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
        if (l.example) h += '<div class="how"><div class="h5">' + l.example.title + '</div><ol style="margin:8px 0 2px 20px;font-size:14.5px;line-height:1.6;color:var(--ink-soft)">' + l.example.steps.map(s => '<li style="padding:3px 0">' + s + '</li>').join('') + '</ol></div>';
        if (l.prompts && l.prompts.length) h += '<div class="h5">' + (l.prompts.length > 1 ? 'Prompts' : 'Prompt') + '</div>' + l.prompts.map(pr => '<div class="pr"><div class="pr-top"><span class="pr-lab">' + pr.lab + '</span></div><div class="pr-txt">' + esc(pr.txt) + '</div><button class="cp">Copy</button></div>').join('');
        const ex = on.exercise || l.exercise;
        if (ex) h += '<div class="ex"><div class="h5">Your turn</div><p>' + ex + '</p></div>';
        h += '<button class="done-btn" data-n="' + l.n + '"></button></div></div>';
      });
    });
    const o = s.online || {};
    if (o.quiz && o.quiz.length) {
      h += '<div class="quiz"><h3>Quick check</h3>' + o.quiz.map((q, qi) => {
        const id = s.n + '-' + qi;
        return '<div class="qq" data-q="' + id + '" data-c="' + q.correct + '"><p>' + (qi + 1) + '. ' + q.q + '</p>'
          + q.options.map((op, oi) => '<div class="opt" data-o="' + oi + '"><b>' + 'ABCD'[oi] + '</b><span>' + op + '</span></div>').join('')
          + '<div class="why">' + q.why + '</div></div>';
      }).join('') + '</div>';
    }
    if (o.reflection) h += '<div class="refl"><h3>Think about it</h3><p style="margin-bottom:10px">' + o.reflection + '</p><textarea data-r="s' + s.n + '" placeholder="Just for you &mdash; nothing is sent anywhere."></textarea><small>Saved in this browser only.</small></div>';
    const prev = si === 0 ? 'home' : 's' + C.sessions[si - 1].n, next = C.sessions[si + 1];
    h += '<div class="pager"><button class="btn dark" data-pg="' + prev + '">&larr; ' + (si === 0 ? 'Home' : 'Session ' + C.sessions[si - 1].n) + '</button>'
      + (next ? '<button class="btn" data-pg="s' + next.n + '">Next: Session ' + next.n + ' &rarr;</button>' : '<button class="btn" data-pg="home">Finish &rarr;</button>') + '</div>';
    pages += h + '</div></div>';
  });

  document.getElementById('nav').innerHTML = nav;
  document.getElementById('pages').innerHTML = home + pages;

  // ---------- state → screen ----------
  function refresh() {
    document.querySelectorAll('.les').forEach(el => {
      const n = el.id.slice(1), d = !!st.done[n];
      el.classList.toggle('done', d);
      el.querySelector('.done-btn').textContent = d ? '✓ Completed' : 'Mark complete';
    });
    let cards = '';
    C.sessions.forEach(s => {
      const [d, t] = progress(s);
      const dot = document.getElementById('dot-s' + s.n);
      dot.className = 'nav-dot' + (d === t ? ' done' : d ? ' part' : '');
      dot.innerHTML = d === t ? '&#10003;' : '';
      document.getElementById('sub-s' + s.n).textContent = d + ' of ' + t + ' lessons complete';
      cards += '<div class="card" data-pg="s' + s.n + '"><div class="cn">Session ' + s.n + '</div><div class="ct">' + s.label + '</div><div class="bar"><i style="width:' + Math.round(d / t * 100) + '%"></i></div><div class="cs">' + (d === t ? 'Complete' : d ? d + ' of ' + t + ' done' : 'Not started') + '</div></div>';
    });
    document.getElementById('cards').innerHTML = cards;
  }

  function show(pg) {
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('show', p.id === 'pg-' + pg));
    document.querySelectorAll('.side-nav [data-pg]').forEach(n => n.classList.toggle('active', n.dataset.pg === pg));
    document.querySelector('.side').classList.remove('open'); document.querySelector('.shade').classList.remove('open');
    window.scrollTo(0, 0);
    try { history.replaceState(null, '', '#' + pg); } catch(e) {}
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const go = e.target.closest('[data-pg]'); if (go) { show(go.dataset.pg); return; }
    const db = e.target.closest('.done-btn'); if (db) { const n = db.dataset.n; st.done[n] = !st.done[n]; save(); refresh(); return; }
    const cp = e.target.closest('.cp'); if (cp) {
      const t = cp.parentElement.querySelector('.pr-txt').textContent;
      const fin = () => { cp.textContent = 'Copied'; cp.classList.add('ok'); setTimeout(() => { cp.textContent = 'Copy'; cp.classList.remove('ok'); }, 1600); };
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(fin).catch(fin);
      else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); fin(); }
      return;
    }
    const op = e.target.closest('.opt'); if (op) {
      const qq = op.closest('.qq'); if (qq.classList.contains('answered')) return;
      st.quiz[qq.dataset.q] = +op.dataset.o; save(); markQuiz(qq); return;
    }
    const lh = e.target.closest('.les-h'); if (lh) { lh.parentElement.classList.toggle('open'); return; }
  });
  function markQuiz(qq) {
    const pick = st.quiz[qq.dataset.q]; if (pick === undefined) return;
    const c = +qq.dataset.c; qq.classList.add('answered');
    qq.querySelectorAll('.opt').forEach(o => { const i = +o.dataset.o; if (i === c) o.classList.add('right'); else if (i === pick) o.classList.add('wrong'); });
  }
  document.querySelectorAll('.qq').forEach(markQuiz);
  document.querySelectorAll('textarea[data-r]').forEach(t => {
    t.value = st.refl[t.dataset.r] || '';
    t.addEventListener('input', () => { st.refl[t.dataset.r] = t.value; save(); });
  });
  document.querySelector('.menu-btn').addEventListener('click', () => { document.querySelector('.side').classList.add('open'); document.querySelector('.shade').classList.add('open'); });
  document.querySelector('.shade').addEventListener('click', () => { document.querySelector('.side').classList.remove('open'); document.querySelector('.shade').classList.remove('open'); });

  refresh();
  const start = (location.hash || '#home').slice(1);
  show(document.getElementById('pg-' + start) ? start : 'home');
})();
</script>
</body>
</html>
