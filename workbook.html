<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAC Claude Training — Your Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --earth:#7F2C2F; --maroon:#5C2B34; --cream:#F0EBE1;
  --ink:#1D2426; --sun:#F4C63F; --paper:#F6F5F2;
  --ink-soft:#5E5A55; --line:#E2DED6;
  --r:10px; --sh:0 1px 3px rgba(29,36,38,.08);
}

body{font-family:'Quicksand',system-ui,sans-serif;font-size:16px;line-height:1.65;color:var(--ink);background:var(--paper)}
.app{display:flex;min-height:100vh}

.side{width:270px;background:var(--ink);color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:50}
.side-head{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.side-logo{width:44px;height:44px;background:var(--earth);border:2px solid var(--sun);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:10px;font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif}
.side-org{font-size:11px;color:var(--sun);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.side-t{font-size:13px;color:rgba(255,255,255,.65);margin-top:2px}
.side-nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-day{padding:14px 18px 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#fff;font-weight:700;border-top:1px solid rgba(255,255,255,.14);margin-top:8px;font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif}
.nav-day:first-child{border-top:none;margin-top:0}
.nav-part{padding:11px 18px 4px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--sun);font-weight:700}
.nav-l{display:flex;gap:9px;align-items:baseline;padding:6px 18px;cursor:pointer;font-size:13.5px;color:rgba(255,255,255,.72);border-left:3px solid transparent;transition:.15s}
.nav-l:hover{background:rgba(255,255,255,.07);color:#fff;border-left-color:var(--sun)}
.nav-n{color:var(--sun);font-weight:700;font-size:11.5px;min-width:26px;flex-shrink:0}
.side-foot{padding:13px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.4)}

.main{margin-left:270px;flex:1;padding:0 0 90px}
.hero{background:var(--earth);color:#fff;padding:34px 46px 30px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:7px;background-image:radial-gradient(circle,var(--sun) 1.5px,transparent 1.5px);background-size:13px 13px;opacity:.45}
.hero h1{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:32px;font-weight:600;letter-spacing:.3px}
.hero .sub{font-size:15px;opacity:.88;margin-top:4px;max-width:640px}
.wrap{max-width:900px;padding:26px 46px}

.panel{background:#fff;border-radius:var(--r);padding:20px 24px;margin-bottom:24px;box-shadow:var(--sh);border-left:4px solid var(--sun)}
.panel h3{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--earth);margin-bottom:10px}
.panel p{font-size:14.5px;color:var(--ink-soft)}
.hw{padding:9px 0;font-size:14.5px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.hw:last-child{border-bottom:none}
.hw b{color:var(--ink);font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-weight:600;font-size:15.5px;letter-spacing:.3px}

.dayband{margin:38px 0 12px;padding:14px 20px;border-radius:var(--r);background:var(--ink);color:#fff;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.dayband:first-child{margin-top:4px}
.dnum{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--sun)}
.dlab{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:19px;font-weight:600}

.part{margin:30px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.part h2{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:20px;color:var(--maroon);font-weight:600;letter-spacing:.3px}

.les{background:#fff;border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden;border:1px solid var(--line)}
.les-h{display:flex;gap:13px;align-items:baseline;padding:16px 22px 4px}
.les-n{background:var(--earth);color:#fff;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;flex-shrink:0;font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif}
.les-title{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:19px;font-weight:600;line-height:1.3;letter-spacing:.2px}
.les-body{padding:6px 22px 22px 22px}
.intro{font-size:15.5px;line-height:1.62;color:var(--ink-soft);margin:8px 0 4px}
ul.pts{margin:10px 0 2px;padding-left:0;list-style:none}
ul.pts li{position:relative;padding:4px 0 4px 22px;font-size:15px;line-height:1.6;color:var(--ink-soft)}
ul.pts li::before{content:'';position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--sun)}
ul.pts li strong{color:var(--ink)}
.h5{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--earth);font-weight:600;margin:18px 0 8px}

.pr{border:1.5px solid var(--line);border-radius:8px;padding:13px 15px;margin:10px 0;position:relative;background:#fff}
.pr:hover{border-color:var(--sun)}
.pr-top{margin-bottom:7px;padding-right:66px}
.pr-lab{font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--maroon)}
.pr-txt{font-size:14.5px;background:var(--paper);padding:12px 14px;border-radius:6px;line-height:1.58;white-space:pre-wrap}
.cp{position:absolute;top:11px;right:12px;background:var(--earth);color:#fff;border:none;padding:5px 13px;border-radius:5px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Quicksand'}
.cp:hover{background:var(--maroon)}
.cp.ok{background:#4A7C59}

.ex{background:var(--cream);border-radius:8px;padding:15px 18px;margin:16px 0 2px}
.ex .h5{margin-top:0;color:var(--maroon)}
.ex p{font-size:14.5px;color:var(--ink)}

table.t{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
table.t th{background:var(--earth);color:#fff;padding:10px 14px;text-align:left;font-size:12.5px;font-family:'Oswald','Arial Narrow',Impact,system-ui,sans-serif;font-weight:600;letter-spacing:.4px}
table.t td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-soft)}
table.t tr:last-child td{border-bottom:none}
table.t td:first-child{font-weight:600;color:var(--ink)}
code{background:var(--cream);padding:1px 6px;border-radius:4px;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}

@media(max-width:900px){.side{display:none}.main{margin-left:0}.wrap,.hero{padding-left:18px;padding-right:18px}}
@media print{.side{display:none}.main{margin-left:0}.cp{display:none}.les{break-inside:avoid;box-shadow:none}}
.how{background:#fff;border:1.5px dashed var(--sun);border-radius:8px;padding:12px 16px;margin:14px 0 4px}
.how .h5{margin-top:0}
.how ul.pts li{font-size:14.5px}
.how .chk{font-family:'Quicksand',system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--ink-soft);font-weight:500}
</style>
</head>
<body>
<!-- In-class workbook. ALL CONTENT COMES FROM content.js — edit that file, not this one. -->
<div class="app">
  <nav class="side">
    <div class="side-head">
      <div class="side-logo">RAC</div>
      <div class="side-org">Rirratjingu</div>
      <div class="side-t">Claude Training — Workbook</div>
    </div>
    <div class="side-nav" id="nav"></div>
    <div class="side-foot">Nhulunbuy, NT &mdash; Yol&#x14B;u Country</div>
  </nav>
  <div class="main">
    <div class="hero">
      <h1 id="h-title"></h1>
      <div class="sub" id="h-sub"></div>
    </div>
    <div class="wrap" id="body"></div>
  </div>
</div>
<script src="content.js"></script>
<script>
(function(){
  const C = COURSE;
  const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const list = a => '<ul class="pts">' + a.map(p => '<li>' + p + '</li>').join('') + '</ul>';

  document.getElementById('h-title').textContent = C.title + ' — Your Workbook';
  document.getElementById('h-sub').textContent = C.subtitle;

  let body = '<div class="panel"><h3>Homework</h3><p style="margin-bottom:10px">Not marked, not checked. Do it because the second time you use something is when it sticks.</p>'
    + C.homework.map(h => '<div class="hw"><b>' + h.title + '</b><br>' + h.text + '</div>').join('') + '</div>';
  let nav = '';

  C.sessions.forEach(s => {
    body += '<div class="dayband"><span class="dnum">Session ' + s.n + '</span><span class="dlab">' + s.label + '</span></div>';
    nav  += '<div class="nav-day">Session ' + s.n + ' — ' + s.label + '</div>';
    s.parts.forEach(p => {
      body += '<div class="part"><h2>' + p.title + '</h2></div>';
      nav  += '<div class="nav-part">' + p.title.replace(/^Part /, '') + '</div>';
         p.lessons.filter(l => !l.onlineOnly).forEach(l => {
        nav  += '<div class="nav-l" data-go="L' + l.n + '"><span class="nav-n">' + l.n + '</span><span>' + l.title + '</span></div>';
        let h = '<div class="les" id="L' + l.n + '"><div class="les-h"><span class="les-n">' + l.n + '</span><div class="les-title">' + l.title + '</div></div><div class="les-body">';
        if (l.intro)  h += '<p class="intro">' + l.intro + '</p>';
        if (l.points) h += list(l.points);
        if (l.howNow) h += '<div class="how"><div class="h5">How it looks right now <span class="chk">— checked ' + C.lastChecked + '</span></div>' + list(l.howNow) + '</div>';
        if (l.table)  h += '<table class="t"><thead><tr>' + l.table.head.map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>'
                         + l.table.rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
        if (l.prompts && l.prompts.length) h += '<div class="h5">' + (l.prompts.length > 1 ? 'Prompts' : 'Prompt') + '</div>'
                         + l.prompts.map(pr => '<div class="pr"><div class="pr-top"><span class="pr-lab">' + pr.lab + '</span></div><div class="pr-txt">' + esc(pr.txt) + '</div><button class="cp">Copy</button></div>').join('');
        if (l.exercise) h += '<div class="ex"><div class="h5">Your turn</div><p>' + l.exercise + '</p></div>';
        body += h + '</div></div>';
      });
    });
  });

  document.getElementById('body').innerHTML = body;
  document.getElementById('nav').innerHTML = nav;

  document.querySelectorAll('.cp').forEach(b => b.addEventListener('click', () => {
    const t = b.parentElement.querySelector('.pr-txt').textContent;
    const done = () => { b.textContent = 'Copied'; b.classList.add('ok'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok'); }, 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(done);
    else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
  }));
  document.querySelectorAll('[data-go]').forEach(n => n.addEventListener('click', () => {
    const el = document.getElementById(n.dataset.go);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }));
})();
</script>
</body>
</html>
